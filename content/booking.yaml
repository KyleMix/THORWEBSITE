intro: TODO — three ways to work with me. None of them have a price on this page, because every piece is different; tell me what you want and I will tell you what it costs.
paths:
- key: tattoo
  title: Tattoo
  offer: TODO — custom pieces, available designs from the flash page, cover-ups by consultation. Black & grey and color. Illustrative, horror, comic, woodblock, bio-surreal, and the occasional very cute thing.
  turnaround: TODO — a consultation first, then drawing time depending on the piece. Session length varies; bigger work is booked in sittings.
  terms: TODO — a deposit holds the appointment and comes off the final price. Reschedule with 48 hours notice and it moves with you.
  send: TODO — the idea, placement, rough size, reference images, and whether you want color or black & grey.
- key: commission
  title: Commission
  offer: TODO — original drawings and portraits, ink and wash on paper, sized to the wall you have in mind.
  turnaround: TODO — usually a few weeks; I will give you a real date when we agree the piece.
  terms: TODO — half up front, half on completion. Shipping from Lake Elsinore, CA.
  send: TODO — subject, size, references, and the deadline if there is one.
- key: event
  title: Live event
  offer: TODO — live art and caricatures for parties, openings, and fundraisers. I draw fast and I am nice to your guests.
  turnaround: TODO — book a few weeks ahead; weekends go first.
  terms: TODO — a booking fee holds the date. Travel within Orange County and the Inland Empire included; further by arrangement.
  send: TODO — date, venue, hours, headcount, and what kind of thing you are picturing.
steps:
- title: The idea
  body: TODO — you send the idea, the placement, and any references. Vague is fine. A feeling is fine.
- title: Consultation
  body: TODO — a free consultation, in person or on a call, to talk size, placement, and what will actually heal well.
- title: Deposit and date
  body: TODO — a deposit holds your date. It comes off the final price.
- title: The drawing
  body: TODO — I draw it. You see it before the day. Small changes are normal.
- title: The session
  body: TODO — stencil, then ink. Eat first. Bring headphones if you want them; bring nobody who will faint.
- title: Healing
  body: TODO — aftercare walked through in person and sent by text. Healed photos in a month, if you are willing.
eventSteps:
- title: Tell me about the event
  body: TODO — date, venue, hours, headcount.
- title: Quote and hold
  body: TODO — a quote within a couple of days; a booking fee holds the date.
- title: The night
  body: TODO — I show up early with paper and markers and draw until the last guest leaves or my hand does.
