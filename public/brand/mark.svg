<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250" role="img" aria-label="Lampkey Artery mark">
  <!-- The enso with the roots that hang off its lower edge. Used large, once
       per page at most. SWAP POINT: replace with Thor's own artwork. -->
  <defs>
    <filter id="lk-m-a" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.028 0.055" numOctaves="4" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="11" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="lk-m-b" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.05 0.03" numOctaves="5" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="B"/>
    </filter>
    <filter id="lk-m-r" x="-40%" y="-10%" width="180%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.09 0.012" numOctaves="3" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g fill="none" stroke="currentColor" stroke-linecap="round">
    <circle cx="100" cy="102" r="72" stroke-width="15" stroke-dasharray="392 61" stroke-dashoffset="330" filter="url(#lk-m-a)" opacity=".92"/>
    <circle cx="100" cy="102" r="81" stroke-width="3.5" stroke-dasharray="196 40 92 250" stroke-dashoffset="300" filter="url(#lk-m-b)" opacity=".62"/>
    <circle cx="101" cy="101" r="63" stroke-width="2.6" stroke-dasharray="120 54 168 180" stroke-dashoffset="250" filter="url(#lk-m-b)" opacity=".5"/>
    <g filter="url(#lk-m-r)" stroke-width="1.7" opacity=".8">
      <path d="M112 172c1 12-2 19 1 29c2 7 1 12-2 18"/>
      <path d="M122 174c0 9 2 15 5 22c2 6 2 10 0 15"/>
      <path d="M132 170c2 8 1 14 4 21"/>
      <path d="M103 173c-1 8 1 13 2 19"/>
      <path d="M142 164c1 6 0 11 2 16"/>
    </g>
  </g>
</svg>
